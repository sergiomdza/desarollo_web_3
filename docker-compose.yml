services:
  mongo:
    image: mongo:latest
    container_name: mongo_container
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin_user
      MONGO_INITDB_ROOT_PASSWORD: web3
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db
    networks:
      - backendNetwork

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    image: backend_productos
    container_name: backend_container
    volumes:
      - ./backend:/app
    environment:
      MONGO_URI: mongodb://admin_user:web3@mongo:27017/
    ports:
      - "8089:8000"
    depends_on:
      - mongo
    networks:
      - backendNetwork

networks:
  backendNetwork:
    driver: bridge
