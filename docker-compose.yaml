services:
  mongo:
    image: mongo:latest
    container_name: mongo_container
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin_user
      MONGO_INITDB_ROOT_PASSWORD: web3
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db
    networks:
      - backendNetwork
  
  backend:
    build: ./backend
    container_name: backend_cantainer
    volumes:
      - ./backend:/app
    ports:
      - "8089:8000"
    networks:
      - backendNetwork
    depends_on:
      - mongo

networks:
  backendNetwork:
    driver: bridge
