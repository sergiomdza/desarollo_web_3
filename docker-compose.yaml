services:
  mongo:
    image: mongo:latest
    container_name: mongo_container
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin_user
      MONGO_INITDB_ROOT_PASSWORD: web3
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend_network
    restart: always
 

  backend: 
    build: . 
    image: backend_productos
    container_name: backend_container
    ports:
      - "8089:8000"
    networks:
      - backend_network

    restart: always
    


volumes:
  mongo_data:
    external: true
      


networks:
  backend_network:
    driver: bridge