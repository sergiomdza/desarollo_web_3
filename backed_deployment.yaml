apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: fast-backend
  ports:
    - protocol: TCP 
      port: 8089
      targetPort: 8089
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: fast-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fast-backend
  template:
    metadata:
      labels:
        app: fast-backend
    spec:
      containers:
      - name: backend-fast
        image: ghcr.io/sergiomdza/desarollo_web_3:carlos_canto-latest
        imagePullPolicy: Always 
        ports:
        - containerPort: 8089

      # ghcr.io/sergiomdza/desarollo_web_3:d

